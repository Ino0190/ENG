<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>再学習 — 現在完了の次から高校まで</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1420; --card:#1a2233; --card2:#222d44;
  --line:#2e3a52; --text:#e8edf5; --sub:#9fb0c8;
  --accent:#f1c40f; --ok:#2ecc71; --ng:#e74c3c; --blue:#5aa7ff;
}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
body{padding:0 0 60px;max-width:680px;margin:0 auto;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(15,20,32,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;align-items:stretch;gap:8px}
.htitle{font-size:16px;font-weight:700;color:var(--accent)}
.hnav{display:flex;flex-wrap:wrap;gap:8px 8px}
.hnav::-webkit-scrollbar{display:none}
.hnav a{flex:0 0 auto;white-space:nowrap;color:var(--sub);font-size:14px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.screen{display:none;padding:18px 16px}
.screen.on{display:block}
h1{font-size:24px;line-height:1.4;margin-bottom:6px}
p.lead{color:var(--sub);font-size:16px;margin-bottom:20px}
.modes{display:flex;gap:10px;margin-bottom:18px}
/* 入口ボタン（次にやることを1つだけ大きく出す） */
.mode.go{width:100%;margin-bottom:14px;padding:18px 12px;font-size:18px;line-height:1.4}
/* 畳める箱。一覧は普段しまっておく */
.fold{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card);overflow:hidden}
.fold>summary{padding:14px 16px;font-size:16px;cursor:pointer;color:var(--sub);list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸ ";color:var(--accent)}
.fold[open]>summary{border-bottom:1px solid var(--line);color:var(--text)}
.fold[open]>summary::before{content:"▾ "}
.fold>#types,.fold>.foldbody{padding:14px 12px}
.fold .foldbody>.bigbtn{margin-bottom:8px}
.fold.sub{background:transparent;margin-bottom:18px}
.fold.sub>summary{padding:10px 12px;font-size:15px}
.fold.sub>.foldbody{padding:12px 0 0}
.mode{flex:1;background:var(--accent);border:none;color:#0f1420;border-radius:12px;padding:14px 8px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.mode.sub{background:var(--card);color:var(--text);border:1px solid var(--line)}
.deck{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s;display:flex;justify-content:space-between;align-items:center;gap:10px}
.deck:active{transform:scale(.98)}
.deck h3{font-size:17px;margin-bottom:3px}
.deck .form{font-size:15px;color:var(--blue);font-weight:700}
.deck .cue{font-size:14px;color:var(--sub)}
.deck .stat{flex:none;text-align:right;font-size:14px;color:var(--sub)}
.deck .stat .m{color:var(--ok);font-weight:700}
.deck .stat .bad{color:var(--ng);font-weight:700}
.badge{display:inline-block;background:rgba(231,76,60,.15);border:1px solid var(--ng);color:var(--ng);border-radius:12px;padding:1px 9px;font-size:13px;font-weight:700;margin-top:3px;margin-right:5px}
.badge.open{background:rgba(241,196,15,.15);border-color:var(--accent);color:var(--accent)}
.badge.locked{background:none;border-color:var(--line);color:var(--sub);font-weight:400}
.deck.weak{border-color:var(--accent)}
.homebtn{background:none;border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:14px}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:10px}
.qmeta .dir{color:var(--accent);font-weight:700}
/* 覚えるモード */
.jpcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 18px;margin-bottom:14px;text-align:center}
.jpcard .jp{font-size:22px;font-weight:700;line-height:1.6}
.jpcard .hint{font-size:14px;color:var(--sub);margin-top:10px}
.encard{display:none;background:var(--card2);border:1px solid var(--blue);border-radius:14px;padding:20px 18px;margin-bottom:14px}
.encard.on{display:block}
.encard .en{font-size:22px;font-weight:700;line-height:1.6;letter-spacing:.01em}
.encard .en b{color:var(--accent)}
.encard .en u,.tcard .exlist u,.exp .full u{color:var(--blue);text-decoration-color:var(--blue)}
.encard .why{font-size:15px;color:var(--sub);margin-top:12px;line-height:1.8}
.encard .swap{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.encard .swap b{display:block;color:var(--blue);font-size:14px;margin-bottom:5px}
.encard .swap div{font-size:16px;color:var(--text);line-height:1.7}
.speak{margin-top:14px;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.bigbtn{width:100%;background:var(--accent);border:none;color:#0f1420;border-radius:12px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px}
.bigbtn.sub{background:var(--card);color:var(--text);border:1px solid var(--line)}
.judge{display:none;gap:10px}
.judge.on{display:flex}
.judge button{flex:1;border-radius:12px;padding:15px 8px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;border:2px solid}
.judge .said{background:rgba(46,204,113,.12);border-color:var(--ok);color:var(--ok)}
.judge .nosaid{background:rgba(231,76,60,.12);border-color:var(--ng);color:var(--ng)}
.sprow{display:flex;gap:8px;margin-top:12px}
.sprow .sbtn{flex:1;background:var(--card);border:1px solid var(--blue);color:var(--blue);border-radius:10px;padding:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.speakbtn{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:5px 10px;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap}
</style>
</head>
<style>
/* 4択モード */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-bottom:16px}
.qcard .jp{font-size:17px;color:var(--sub);margin-bottom:10px}
.qcard .en{font-size:20px;font-weight:700;line-height:1.7}
.qcard .en .bl{display:inline-block;min-width:110px;border-bottom:2px solid var(--accent);color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:15px;font-size:18px;font-weight:700;cursor:pointer;text-align:center;transition:.12s}
.opt:active{transform:scale(.99)}
.opt.correct{border-color:var(--ok);background:rgba(46,204,113,.12)}
.opt.wrong{border-color:var(--ng);background:rgba(231,76,60,.12)}
.opt.disabled{cursor:default}
.exp{display:none;margin-top:16px;background:var(--card2);border-radius:12px;padding:16px;font-size:15px;line-height:1.8}
.exp.on{display:block}
.exp .verdict{font-size:17px;font-weight:700;margin-bottom:8px}
.exp .verdict.ok{color:var(--ok)}
.exp .verdict.ng{color:var(--ng)}
.exp .full{font-size:18px;font-weight:700;margin:8px 0}
.exp .full b{color:var(--accent)}
.exp .cue{background:rgba(90,167,255,.1);border:1px solid var(--blue);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15px}
.exp .cue b{color:var(--blue)}
.exp .loop{margin-top:10px;font-size:14px;color:var(--accent);font-weight:700}
.nextbtn{margin-top:16px;width:100%;background:var(--accent);border:none;color:#0f1420;border-radius:12px;padding:15px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;display:none}
.nextbtn.on{display:block}
/* 早見表 */
.flow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.flow h3{font-size:18px;color:var(--accent);margin-bottom:10px}
.flow ol{margin-left:20px;font-size:16px;line-height:2}
.flow ol b{color:var(--blue)}
.flow .ans{color:var(--ok);font-weight:700}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
.tcard h3{font-size:17px;margin-bottom:4px}
.tcard .form{font-size:17px;color:var(--blue);font-weight:700;margin-bottom:6px}
.tcard .cue{font-size:14px;color:var(--accent);margin-bottom:8px}
.tcard .core{font-size:15px;color:var(--text);line-height:1.8}
.tcard .ng{font-size:14px;color:var(--ng);margin-top:8px}
.tcard .exlist{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tcard .exlist div{font-size:15px;margin-bottom:6px;line-height:1.6}
.tcard .exlist .e{font-weight:700}
.tcard .exlist .j{color:var(--sub);font-size:14px}
.stagehd{margin:22px 0 10px}
.stagehd:first-child{margin-top:4px}
.stagehd h2{font-size:19px;color:var(--accent);margin-bottom:4px}
.stagehd p{font-size:14px;color:var(--sub);line-height:1.7}
.stagehd .go{margin-top:8px;display:flex;gap:8px}
.stagehd .go button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 6px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
/* AIに頼む */
.promptBtn{width:100%;margin-top:12px;background:var(--card);border:1px solid var(--blue);color:var(--blue);border-radius:10px;padding:11px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.promptHint{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.7}
.appverline{font-size:12px;color:var(--sub);margin-top:0;text-align:right;opacity:.85}
.appverline .appver{font-weight:700}
.emptywarn{background:rgba(231,76,60,.12);border:1px solid var(--ng);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.8;margin-bottom:10px}
.emptywarn b{color:var(--ng)}
details.jinv{margin:8px 0}
details.jinv summary{cursor:pointer;font-size:14px;color:var(--blue);font-weight:700}
.invtbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.invtbl th,.invtbl td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.invtbl th{color:var(--sub);font-weight:600}
.invtbl tr.unk td{color:var(--sub)}
.invtbl .unktag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.verline{background:var(--card2);border:1px solid var(--blue);border-radius:10px;padding:10px 13px;font-size:14px;font-weight:700;color:var(--blue);margin-bottom:6px}
.jta{width:100%;min-height:96px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;margin:8px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--blue);color:var(--text);border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:92%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.result{text-align:center;padding:30px 0}
.result .big{font-size:40px;font-weight:700;margin-bottom:8px}
.result p{color:var(--sub);font-size:16px;margin-bottom:20px}
.result .rbtn{display:block;width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px}
.result .rbtn.main{background:var(--accent);border-color:var(--accent);color:#0f1420}
</style>
<body>
<header id="apphdr" data-title="🧱 再学習"></header>
<script src="menu.js"></script>
<script src="fx.js"></script>

<div class="screen on" id="scr-home">
  <h1>現在完了の次から高校まで</h1>
  <p class="lead" id="homelead"></p>

  <!-- 入口は1つ。次にやるステージを自動で選ぶ -->
  <button class="mode go" id="btn-next" onclick="startNext()">▶ 続ける</button>

  <div class="deck" onclick="startLearn('key')" id="deck-key" style="border-color:var(--blue)">
    <div><h3>🗣 暗唱セット（20文）</h3><p class="cue" id="keydesc"></p></div>
    <div class="stat"><div class="m" id="keystat"></div></div>
  </div>
  <div class="deck" onclick="startQuiz('miss')" id="deck-weak" style="border-color:var(--accent);display:none">
    <div><h3>🎯 間違えた型だけ（多めに出す）</h3><p class="cue" id="weakdesc"></p></div>
  </div>
  <div class="deck" onclick="startQuiz('need')" id="deck-need" style="border-color:var(--ng);display:none">
    <div><h3>🔁 まだ覚えてないやつだけ</h3><p class="cue" id="needdesc"></p></div>
  </div>

  <details class="fold" id="fold-stages">
    <summary>ステージを選ぶ（6つ・<span id="stagesum"></span>）</summary>
    <div id="types"></div>
  </details>

  <details class="fold">
    <summary>そのほか</summary>
    <div class="foldbody">
      <button class="bigbtn sub" onclick="show('scr-chart')">🔍 ステージごとの見分け方</button>
      <button class="bigbtn sub" id="btn-all-learn" onclick="startLearn(null)">📖 全部まとめて覚える</button>
      <button class="bigbtn sub" id="btn-all-quiz" onclick="startQuiz(null)">✏️ 全部まとめて試す</button>
      <button class="bigbtn sub" id="btn-aimiss" onclick="copyPromptMiss()" style="display:none">🤖 間違えた型の例文をAIに頼む</button>
    </div>
  </details>

</div>

<div class="screen" id="scr-learn">
  <button class="homebtn" onclick="goHome()">← 型の一覧</button>
  <div class="qmeta"><span class="dir" id="ldir"></span><span id="lprog"></span></div>
  <div class="jpcard"><div class="jp" id="ljp"></div><div class="hint">英語で言ってみる → タップで答え</div></div>
  <button class="bigbtn" id="lreveal" onclick="reveal()">答えを見る</button>
  <div class="encard" id="lencard">
    <div class="en" id="len"></div>
    <div class="why" id="lwhy"></div>
    <button class="speak" onclick="speak(document.getElementById('len').textContent)">🔊 読み上げ</button>
  </div>
  <div class="judge" id="ljudge">
    <button class="said" onclick="judge(true)">⭕ 言えた</button>
    <button class="nosaid" onclick="judge(false)">❌ 言えなかった</button>
  </div>
</div>

<div class="screen" id="scr-quiz">
  <button class="homebtn" onclick="goHome()">← 型の一覧</button>
  <div class="qmeta"><span class="dir" id="qdir"></span><span id="qprog"></span></div>
  <div class="qcard"><div class="jp" id="qjp"></div><div class="en" id="qen"></div></div>
  <div class="opts" id="qopts"></div>
  <div class="exp" id="qexp"></div>
  <button class="nextbtn" id="nextbtn" onclick="nextQ()">次へ</button>
</div>

<div class="screen" id="scr-chart">
  <button class="homebtn" onclick="goHome()">← 型の一覧</button>
  <h1>見分け方</h1>
  <p class="lead">ステージごとに、何で見分けるかをまとめてある。迷ったらここに戻る。</p>
  <div id="chartbody"></div>
</div>

<div class="screen" id="scr-result">
  <div class="result">
    <div class="big" id="rtitle"></div>
    <p id="rmsg"></p>
    <button class="rbtn main" onclick="goHome()">型の一覧へ</button>
    <button class="rbtn" id="rextra" style="display:none"></button>
    <button class="rbtn" id="ragain" onclick="retry()">もう一度</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="ver.js"></script>
<script src="speak.js"></script>
<script src="jumon.js"></script>
<script src="saigakushu.js"></script>
<script>
// 記録: said=覚えるモードで言えたか / need=定着ループ（4択で間違えたら3回連続正解まで残る）
const KEY="saigaku_v1";
let st=load(),said=st.said||{},need=st.need||{},missT=st.missT||{},ansho=st.ansho||{};
let queue=[],cur=null,answered=false,revealed=false;
let okCount=0,total=0,lastMode=null;
const byId={};SSENTS.forEach(s=>byId[s.id]=s);
const typeById={};STYPES.forEach(t=>typeById[t.id]=t);

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){localStorage.setItem(KEY,JSON.stringify({said,need,missT,ansho}))}
window.__jumonMem=function(){return {saigaku_v1:JSON.stringify({said:said,need:need,missT:missT,ansho:ansho})}};
// 暗唱＝型ごと1本の代表文を3回続けて言えたら覚えた扱い
function keySents(){return SSENTS.filter(s=>s.key)}
function anshoDone(){return keySents().filter(s=>(ansho[s.id]||0)>=3).length}
// 間違えた型は追加の文（lv:2）が解放される。一度解放したら戻さない
function unlocked(tid){return (missT[tid]||0)>0}
function avail(s){return (s.lv||1)===1||unlocked(s.t)}
function missAdd(tid){
  const before=unlocked(tid);
  missT[tid]=(missT[tid]||0)+1;
  return !before;   // 今回はじめて解放されたか
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));document.getElementById(id).classList.add("on");window.scrollTo(0,0)}
function goHome(){
  // #jumon を残すと、次に同じリンクを押しても開かない・リロードでじゅもん画面に戻る
  if(location.hash&&history.replaceState)history.replaceState(null,"",location.pathname);
  renderHome();show("scr-home");
}
function sentsOf(t){
  if(!t)return SSENTS.filter(avail);
  if(t==="key")return keySents();                         // 暗唱セット（型ごと1本）
  if(t==="miss")return SSENTS.filter(s=>unlocked(s.t));   // 間違えた型だけ（追加ぶんも全部）
  if(String(t).indexOf("s:")===0){
    const sid=String(t).slice(2);
    const ts=STYPES.filter(x=>x.s===sid).map(x=>x.id);
    return SSENTS.filter(s=>ts.indexOf(s.t)>=0&&avail(s));
  }
  return SSENTS.filter(s=>s.t===t&&avail(s));
}
function allOf(t){return SSENTS.filter(s=>s.t===t)}   // 解放の有無を問わない全文
function typesOfStage(sid){return STYPES.filter(t=>t.s===sid)}

// 英文に印を付ける。blankは黄色太字、決め手の語は青の下線。
// blankの中にcueが入っている文（Have you ever eaten）があるので、先にblankを退避してから置換する。
function markEn(s){
  let h=esc(s.en),b=esc(s.blank);
  h=h.replace(b,"\u0001");
  if(s.cue&&!s.blank.includes(s.cue))h=h.replace(esc(s.cue),"<u>"+esc(s.cue)+"</u>");
  return h.replace("\u0001","<b>"+b+"</b>");
}
// 空所を作った英文（4択用）
function blankEn(s){
  return esc(s.en).replace(esc(s.blank),'<span class="bl">　　　</span>');
}
// 声の選び方と読み上げは speak.js が持つ（端末ごとに一番自然な声を選ぶ）
function speak(text,opt){ if(window.Speak) Speak.say(text,opt); }
</script>
<script>
function renderHome(){
  document.getElementById("types").innerHTML=SSTAGES.map((stg,i)=>{
    const all=sentsOf("s:"+stg.id);
    const done=all.filter(s=>said[s.id]===1).length;
    const head='<div class="stagehd"><h2>ステージ'+(i+1)+' '+stg.name+'（'+done+'/'+all.length+'）</h2>'
      +'<p>'+stg.lead+'</p><div class="go">'
      +'<button onclick="startLearn(\'s:'+stg.id+'\')">📖 このステージを覚える</button>'
      +'<button onclick="startQuiz(\'s:'+stg.id+'\')">✏️ 試す</button></div></div>';
    // 型ごとのカードは畳んでおく。ステージ6つ分を開くと20枚が並んで読めなくなる
    const tn=typesOfStage(stg.id).length;
    const decks=typesOfStage(stg.id).map(t=>{
      const ss=sentsOf(t.id);
      const sc=ss.filter(s=>said[s.id]===1).length;
      const nd=ss.filter(s=>need[s.id]>0).length;
      const ms=missT[t.id]||0;
      const extra=allOf(t.id).length-sentsOf(t.id).length;   // まだ解放していない追加の数
      let badge=nd?'<span class="badge">🔁 '+nd+'文</span>':"";
      if(ms)badge+='<span class="badge open">🔓 間違い'+ms+'回 → 追加'+(allOf(t.id).length-5)+'文を出している</span>';
      else if(extra)badge+='<span class="badge locked">＋'+extra+'文（間違えると出る）</span>';
      const cls=sc===ss.length?"m":(sc?"":"bad");
      return '<div class="deck'+(ms?' weak':'')+'" onclick="startLearn(\''+t.id+'\')">'
        +'<div><h3>'+t.name+'</h3><div class="form">'+t.form+'</div>'
        +'<div class="cue">合図: '+t.cue+'</div>'+badge+'</div>'
        +'<div class="stat"><div class="'+cls+'">言えた '+sc+'/'+ss.length+'</div></div></div>';
    }).join("");
    return head+'<details class="fold sub"><summary>型ごとにやる（'+tn+'つ）</summary>'
      +'<div class="foldbody">'+decks+'</div></details>';
  }).join("");
  // 定着待ち（0件なら出さない）
  const nd=SSENTS.filter(s=>need[s.id]>0).length;
  const ndeck=document.getElementById("deck-need");
  ndeck.style.display=nd?"flex":"none";
  document.getElementById("needdesc").textContent=nd+"文が定着待ち。3回連続で正解すると消える。";
  // 間違えた型だけ（追加ぶんも全部）
  const weakT=STYPES.filter(t=>unlocked(t.id));
  const weakN=sentsOf("miss").length;
  const wd=document.getElementById("deck-weak");
  wd.style.display=weakT.length?"flex":"none";
  document.getElementById("weakdesc").textContent=
    weakT.length+"つの型で間違えている。追加ぶんを含めて "+weakN+"文（"+weakT.map(t=>t.name).join("・")+"）";
  document.getElementById("btn-aimiss").style.display=weakT.length?"block":"none";
  // 入口ボタンとリード文
  renderNext();
  // 暗唱セット
  const kd=anshoDone(),kt=keySents().length;
  document.getElementById("keystat").textContent="覚えた "+kd+"/"+kt;
  document.getElementById("keydesc").textContent=kd===kt
    ? "20の型ぜんぶ、代表文が口から出る状態。あとは差し替えて使うだけ。"
    : "型ごとに1本だけ。これを覚えると、あとは中身を入れ替えれば言える。3回続けて言えたら覚えた扱い。";
  // いま出せる文の数をボタンに出す（解放が進むと増える）
  const total=sentsOf(null).length;
  document.getElementById("btn-all-learn").textContent="📖 全部まとめて覚える（"+total+"文）";
  document.getElementById("btn-all-quiz").textContent="✏️ 全部まとめて試す（"+total+"問）";
  const doneAll=SSENTS.filter(avail).filter(s=>said[s.id]===1).length;
  document.getElementById("stagesum").textContent="言えた "+doneAll+"/"+total;
}

// ===== 次にやること =====
// 未完のステージのうち、いちばん上のものを返す。全部済んでいれば null。
function nextStage(){
  for(const stg of SSTAGES){
    const ss=sentsOf("s:"+stg.id);
    if(ss.some(s=>said[s.id]!==1))return stg;
  }
  return null;
}
function renderNext(){
  const btn=document.getElementById("btn-next"),lead=document.getElementById("homelead");
  const kd=anshoDone(),kt=keySents().length;
  // 入口が暗唱のときは、下の暗唱カードを隠す（同じものが2つ並ぶのを避ける）
  document.getElementById("deck-key").style.display=(kd<kt)?"none":"flex";
  if(kd<kt){
    btn.textContent="▶ 暗唱セットから始める（"+kd+"/"+kt+"）";
    lead.textContent="型を見分けるより先に、代表文が口から出る状態を作る。ここが入口。20文だけ。";
    btn.dataset.go="key";return;
  }
  const stg=nextStage();
  if(stg){
    const i=SSTAGES.indexOf(stg)+1;
    const ss=sentsOf("s:"+stg.id),done=ss.filter(s=>said[s.id]===1).length;
    btn.textContent="▶ ステージ"+i+" を続ける（"+done+"/"+ss.length+"）";
    lead.textContent=stg.name+" — "+stg.lead;
    btn.dataset.go="s:"+stg.id;return;
  }
  const nd=SSENTS.filter(s=>need[s.id]>0).length;
  if(nd){
    btn.textContent="▶ 定着待ちの"+nd+"文をやる";
    lead.textContent="ひととおり言えた。あとは3回続けて正解する文を消していくだけ。";
    btn.dataset.go="need";return;
  }
  btn.textContent="✏️ 全部を試す（"+sentsOf(null).length+"問）";
  lead.textContent="6ステージぜんぶ言えた状態。四択で抜けを探す。";
  btn.dataset.go="quizall";
}
function startNext(){
  const go=document.getElementById("btn-next").dataset.go;
  if(go==="key")startLearn("key");
  else if(go==="need")startQuiz("need");
  else if(go==="quizall")startQuiz(null);
  else startLearn(go);
}
function renderChart(){
  document.getElementById("chartbody").innerHTML=SSTAGES.map((stg,i)=>{
    const head='<div class="stagehd"><h2>ステージ'+(i+1)+' '+stg.name+'</h2><p>'+stg.lead+'</p></div>';
    const cards=typesOfStage(stg.id).map(t=>{
      const ex=sentsOf(t.id).map(s=>'<div><span class="e">'+markEn(s)+'</span><br><span class="j">'+esc(s.jp)+'</span></div>').join("");
      return '<div class="tcard"><h3>'+t.name+'</h3><div class="form">'+t.form+'</div>'
        +'<div class="cue">合図: '+t.cue+'</div><div class="core">'+t.core+'</div>'
        +'<div class="ng">✗ よくある間違い: '+t.ng+'</div>'
        +'<div class="exlist">'+ex+'</div>'
        +'<button class="promptBtn" onclick="copyPromptType(\''+t.id+'\',10)">🤖 この型の例文をAIに頼む（コピー）</button>'
        +'<div class="promptHint">この型の要点・私の癖・手元の文の一覧を含んだ依頼文をコピーします。ChatGPTやClaudeに貼れば10文作ってくれます。最後に日本語だけの一覧も付くので、答えを隠して練習できます。</div>'
        +'</div>';
    }).join("");
    return head+cards;
  }).join("");
}
// ===== AIに例文を頼む文を作ってコピーする =====
// 実装はせず「AIに頼むための文」を吐く。貼り付ける先は ChatGPT でも Claude でもよい。
const MY_WEAK=[
  "・「〜している」「〜していた」という日本語を、英語でも全部 be + ing にしてしまう（is standing / am knowing / where is he living）。",
  "・名詞をうしろから飾るだけの場面で be を足してしまう（The man is standing over there is my boss）。",
  "・関係代名詞で、前に出した名詞の目的語をうしろにもう一度置いてしまう（The book I read it）。"
].join("\n");

function promptForTypes(tids,perType){
  const blocks=tids.map(tid=>{
    const t=typeById[tid];
    const have=allOf(tid).map(s=>"  - "+s.en).join("\n");
    return "【型】"+t.name+"\n"
      +"  形: "+t.form+"\n"
      +"  合図: "+t.cue+"\n"
      +"  要点: "+t.core+"\n"
      +"  よくある間違い: "+t.ng+"\n"
      +"  すでに持っている文（同じ内容は避けてほしい）:\n"+have;
  }).join("\n\n");
  return "英語の練習用に例文を作ってください。下の型について、それぞれ"+perType+"文ずつお願いします。\n\n"
    +blocks+"\n\n"
    +"【私の癖（誤答の例として使ってください）】\n"+MY_WEAK+"\n\n"
    +"【条件】\n"
    +"・文法用語を使わないでください（「現在完了」「分詞構文」「関係代名詞」などの名前は出さない）。"
    +"「期間が付いているから」「文にもう動詞があるから」のように、見て分かる手がかりで説明してください。\n"
    +"・場面は仕事にしてください（打合せ・メール・提案・システムの話）。\n"
    +"・1文は12語以内で、そのまま覚えて使える長さにしてください。\n"
    +"・固有名詞は使わないでください。\n\n"
    +"【出してほしい形式】各文をこの5行で書いてください。\n"
    +"日本語:\n英語:\n決め手: どの語を見てこの形に決めたか\n"
    +"やりがちな間違い: 上の癖で間違えるとどうなるか\n入れ替え例: 主語か目的語を変えた文を1つ\n\n"
    +"【最後に】答えを隠して練習できるように、日本語だけを並べた一覧を最後に付けてください。";
}

function copyText(text,msg){
  const done=()=>showToast(msg);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,()=>fallback());
  }else fallback();
  function fallback(){
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.top="-1000px";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done();}
    catch(e){showToast("コピーできなかった。長押しで選択してください");}
    document.body.removeChild(ta);
  }
}
let toastTimer=null;
function showToast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.className="toast on";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.className="toast"},2600);
}
// 型ひとつぶん
function copyPromptType(tid,n){
  copyText(promptForTypes([tid],n||10),"📋 コピーした。AIに貼り付けて例文を作ってもらう");
}
// 間違えた型ぜんぶ
function copyPromptMiss(){
  const tids=STYPES.filter(t=>unlocked(t.id)).map(t=>t.id);
  if(!tids.length){showToast("まだ間違えた型がない");return;}
  copyText(promptForTypes(tids,5),"📋 "+tids.length+"つの型ぶんをコピーした");
}

function resetAll(){
  if(confirm("言えた記録・定着記録・間違えた型の記録を全部消す？（追加の文も出なくなる）")){
    said={};need={};missT={};ansho={};save();goHome();
  }
}
window.__resetAll=resetAll;   // ☰ メニューから呼ぶ
</script>
<script>
// ===== 覚えるモード: 日本語を見て英語で言う → 答え合わせ → 言えた/言えなかった =====
function startLearn(t){
  lastMode={kind:"learn",t};
  queue=shuffle(sentsOf(t).map(s=>s.id));
  total=queue.length;okCount=0;
  showL();show("scr-learn");
}
function showL(){
  if(!queue.length){showResult("learn");return;}
  revealed=false;
  cur=byId[queue[0]];
  const isKey=lastMode&&lastMode.t==="key";
  document.getElementById("ldir").textContent=(isKey?"🗣 暗唱 / ":"")+typeById[cur.t].name;
  if(isKey){
    const c=ansho[cur.id]||0;
    document.getElementById("lprog").textContent=
      "残り "+queue.length+"文（覚えた "+okCount+"/"+total+"）"+(c?" ・この文はあと"+(3-c)+"回":"");
  }else{
    document.getElementById("lprog").textContent="残り "+queue.length+"文（言えた "+okCount+"/"+total+"）";
  }
  document.getElementById("ljp").textContent=cur.jp;
  document.getElementById("len").innerHTML=markEn(cur);
  let w=esc(cur.why);
  if(cur.swap&&cur.swap.length){
    w+='<div class="swap"><b>入れ替えて使う</b>'+cur.swap.map(x=>'<div>'+esc(x)+'</div>').join("")+'</div>';
  }
  document.getElementById("lwhy").innerHTML=w;
  document.getElementById("lencard").className="encard";
  document.getElementById("ljudge").className="judge";
  document.getElementById("lreveal").style.display="block";
  window.scrollTo(0,0);
}
function reveal(){
  if(revealed)return;revealed=true;
  document.getElementById("lencard").className="encard on";
  document.getElementById("ljudge").className="judge on";
  document.getElementById("lreveal").style.display="none";
  speak(document.getElementById("len").textContent);
}
function judge(ok){
  if(!revealed)return;
  // 暗唱モードは3回続けて言えたら覚えた扱い。間違えても型の苦手判定には入れない
  const jbtn=document.querySelector("#ljudge ."+(ok?"said":"nosaid"));
  if(lastMode&&lastMode.t==="key"){
    // 3回続けて言えた瞬間＝暗唱の定着。いちばん大きい演出にする
    const willMaster=ok&&(ansho[cur.id]||0)+1>=3;
    if(window.FX)FX.hit(ok,jbtn,{quiet:!ok,master:willMaster});
    if(ok){
      ansho[cur.id]=(ansho[cur.id]||0)+1;
      if(ansho[cur.id]>=3){said[cur.id]=1;okCount++;queue.shift();}
      else{queue.shift();queue.splice(Math.min(3,queue.length),0,cur.id);}
    }else{
      ansho[cur.id]=0;
      queue.shift();queue.splice(Math.min(3,queue.length),0,cur.id);
    }
    save();showL();return;
  }
  // 自己申告なので「言えなかった」は演出を出さず、連続だけ切る
  if(window.FX)FX.hit(ok,jbtn,{quiet:!ok});
  if(ok){said[cur.id]=1;okCount++;queue.shift();}
  else{
    said[cur.id]=0;
    need[cur.id]=3;                                  // 4択側の定着ループに送る
    missAdd(cur.t);                                  // その型に追加の文を解放する
    queue.shift();queue.splice(Math.min(3,queue.length),0,cur.id);  // 数文後にもう一度出す
  }
  save();showL();
}
</script>
<script>
// ===== 4択モード: 空所に入る形を選ぶ。間違えたら3回連続正解するまで残る =====
function startQuiz(t){
  lastMode={kind:"quiz",t};
  let ids;
  if(t==="need"){ids=SSENTS.filter(s=>need[s.id]>0).map(s=>s.id);if(!ids.length)return;}
  else ids=sentsOf(t).map(s=>s.id);
  queue=shuffle(ids);total=queue.length;okCount=0;
  showQ();show("scr-quiz");
}
function showQ(){
  if(!queue.length){showResult("quiz");return;}
  answered=false;
  cur=byId[queue[0]];
  document.getElementById("qdir").textContent=typeById[cur.t].name;
  document.getElementById("qprog").textContent="残り "+queue.length+"問（正解 "+okCount+"/"+total+"）";
  document.getElementById("qjp").textContent=cur.jp;
  document.getElementById("qen").innerHTML=blankEn(cur);
  const opts=shuffle(cur.o.slice());
  document.getElementById("qopts").innerHTML=opts.map(o=>
    '<div class="opt" data-v="'+esc(o).replace(/"/g,"&quot;")+'" onclick="answer(this)">'+esc(o)+'</div>').join("");
  document.getElementById("qexp").className="exp";
  document.getElementById("nextbtn").className="nextbtn";
  window.scrollTo(0,0);
}
function answer(el){
  if(answered)return;answered=true;
  const correct=cur.blank,ok=el.dataset.v===correct;
  document.querySelectorAll(".opt").forEach(o=>{
    o.classList.add("disabled");o.onclick=null;
    if(o.dataset.v===correct)o.classList.add("correct");
    else if(o===el)o.classList.add("wrong");
  });
  let loop="";
  if(ok){
    if(need[cur.id]>0){
      need[cur.id]--;
      if(need[cur.id]<=0){delete need[cur.id];loop="🎉 3回連続正解＝定着した";queue.shift();okCount++;}
      else{loop="あと"+need[cur.id]+"回連続で正解すると定着";
        queue.shift();queue.splice(Math.min(3,queue.length),0,cur.id);}
    }else{queue.shift();okCount++;}
  }else{
    need[cur.id]=3;loop="3回連続で正解すると定着（間違えたのでリセット）";
    const justOpen=missAdd(cur.t);                   // その型に追加の文を解放する
    if(justOpen)loop+="<br>🔓 この型は苦手と判定した。追加の3文を解放したので、次にこの型を始めると8文出る";
    // 解放済みでまだキューに入っていない文があれば、この場で足す
    const inQ={};queue.forEach(id=>inQ[id]=1);
    const add=allOf(cur.t).filter(s=>s.lv===2&&!inQ[s.id]&&s.id!==cur.id).map(s=>s.id);
    queue.shift();queue.splice(Math.min(3,queue.length),0,cur.id);
    if(add.length){queue=queue.concat(add);total+=add.length;}
    save();
  }
  save();
  if(window.FX)FX.hit(ok,el,{master:loop.indexOf("定着した")>=0});
  const t=typeById[cur.t];
  document.getElementById("qexp").innerHTML='<div class="verdict '+(ok?"ok":"ng")+'">'+(ok?"⭕ 正解":"❌ 不正解")+'</div>'
    +'<div class="full">'+markEn(cur)+'</div>'
    +'<div class="cue">この文は「<b>'+t.name+'</b>」の型。'+(cur.cue?'合図は <b>'+esc(cur.cue)+'</b>。':'')+'</div>'
    +'<div>'+esc(cur.why)+'</div>'
    +(loop?'<div class="loop">🔁 '+loop+'</div>':"")
    +'<button class="promptBtn" onclick="copyPromptType(\''+cur.t+'\',10)">🤖 この型の例文をAIに頼む（コピー）</button>'
    +'<div class="promptHint">この型の要点・私の癖・手元の文を含んだ依頼文をコピーします。最後に日本語だけの一覧も付くので、答えを隠して練習できます。</div>';
  window.__lastEn=cur.en;
  document.getElementById("qexp").innerHTML+='<div class="sprow">'+'<button class="sbtn" onclick="speak(window.__lastEn)">🔊 もう一度</button>'+'<button class="sbtn" onclick="speak(window.__lastEn,{slow:true})">🐢 ゆっくり</button>'+'</div>';
  document.getElementById("qexp").className="exp on";
  speak(cur.en);
  document.getElementById("nextbtn").className="nextbtn on";
}
function nextQ(){showQ()}
</script>
<script>
function showResult(kind){
  const ex=document.getElementById("rextra");
  if(kind==="learn"){
    document.getElementById("rtitle").textContent=okCount+" / "+total;
    const nd=SSENTS.filter(s=>need[s.id]>0).length;
    document.getElementById("rmsg").textContent=okCount===total
      ? "全部言えた。4択で確認すると定着がはっきりする。"
      : "言えなかった文は定着待ちに入れた（全体で"+nd+"文）。4択で3回連続正解すると消える。";
    ex.style.display="block";
    ex.textContent="✏️ この型を4択で試す";
    ex.onclick=()=>startQuiz(lastMode.t);
  }else{
    document.getElementById("rtitle").textContent=okCount+" / "+total;
    const nd=SSENTS.filter(s=>need[s.id]>0).length;
    document.getElementById("rmsg").textContent=nd
      ? "全体で定着待ちが"+nd+"文ある（🔁から再挑戦）。"
      : "🎉 定着待ちゼロ。";
    ex.style.display="block";
    ex.textContent="📖 この型を声に出して覚える";
    ex.onclick=()=>startLearn(lastMode.t==="need"?null:lastMode.t);
  }
  show("scr-result");
}
function retry(){
  if(!lastMode)return goHome();
  lastMode.kind==="learn"?startLearn(lastMode.t):startQuiz(lastMode.t);
}
renderHome();
renderChart();
// じゅもんの画面とハッシュ処理は jumon.js が持つ
</script>
